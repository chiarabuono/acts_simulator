controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controller for Pulley A (Position)
    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    effort_controller:
      type: effort_controllers/JointGroupEffortController

forward_position_controller:
  ros__parameters:
    joints:
      - joint_pulley_A_x
      - joint_pulley_A_y
      - joint_pulley_A_z

effort_controller:
  ros__parameters:
    joints:
      - joint_pulley_B_z